name: Build Yatsukusa Park Blender artifact

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/yatsukusa/**"
      - ".github/workflows/yatsukusa-blender-artifact.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender xvfb zip python3-numpy
          blender --version
          python3 -c "import numpy; print(numpy.__version__)"
      - name: Decode and patch procedural builder
        run: |
          python3 - <<'PY'
          import base64, lzma
          from pathlib import Path
          src = Path('tools/yatsukusa/remote_compact.xz.b85').read_text().strip()
          target = Path('tools/yatsukusa/build_yatsukusa_park.py')
          target.write_bytes(lzma.decompress(base64.b85decode(src)))
          lines = target.read_text().splitlines()
          start = lines.index('def poly(n,P,z,x,c):')
          end = lines.index('def path(n,P,w):')
          replacement = "def poly(n,P,z,x,c):\n V=[Vector((a,b,z)) for a,b in P];T=tessellate_polygon([V])\n if T and isinstance(T[0][0],int):F=[tuple(t) for t in T]\n else:\n  D={tuple(v):i for i,v in enumerate(V)};F=[tuple(D[tuple(v)] for v in t) for t in T]\n me=bpy.data.meshes.new(n);me.from_pydata([tuple(v) for v in V],[],F or [tuple(range(len(V)))]);me.update();o=bpy.data.objects.new(n,me);C[x].objects.link(o);return mat(o,c)".splitlines()
          lines[start:end] = replacement
          target.write_text('\n'.join(lines) + '\n')
          PY
          python3 -m py_compile tools/yatsukusa/build_yatsukusa_park.py
      - name: Build model and representative renders
        id: blender
        env:
          YATSUKUSA_OUTPUT_DIR: ${{ github.workspace }}/yatsukusa-output
        run: |
          set -o pipefail
          mkdir -p "$YATSUKUSA_OUTPUT_DIR"
          xvfb-run -a blender --background --python-exit-code 1 --python tools/yatsukusa/build_yatsukusa_park.py 2>&1 | tee "$YATSUKUSA_OUTPUT_DIR/blender-build.log"
          find "$YATSUKUSA_OUTPUT_DIR" -maxdepth 2 -type f -printf '%P %k KB\n' | sort
          test -s "$YATSUKUSA_OUTPUT_DIR/YatsukusaPark_VRChat.blend"
          test -s "$YATSUKUSA_OUTPUT_DIR/YatsukusaPark_PC.glb"
          test -s "$YATSUKUSA_OUTPUT_DIR/YatsukusaPark_Quest.glb"
          test -s "$YATSUKUSA_OUTPUT_DIR/YatsukusaPark_Unity.fbx"
          test "$(find "$YATSUKUSA_OUTPUT_DIR/renders" -name '*.png' -type f | wc -l)" -ge 8
      - name: Package artifact
        if: always()
        run: |
          mkdir -p yatsukusa-output
          cp tools/yatsukusa/build_yatsukusa_park.py yatsukusa-output/
          (cd yatsukusa-output && zip -r ../YatsukusaPark_VRChat.zip .)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: YatsukusaPark-VRChat
          path: |
            yatsukusa-output/
            YatsukusaPark_VRChat.zip
          if-no-files-found: error
          retention-days: 1
